name: Publish uploaded Ershad preview bundle

on:
  push:
    branches:
      - main
    paths:
      - "deploy-bundle/**"
      - ".github/workflows/publish-preview-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-preview-bundle
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack the uploaded site
        shell: bash
        env:
          EXPECTED_PARTS: "18"
          EXPECTED_SHA256: 9fc326e9ee345ac3d48ea80d39963305fae14263f8f052e9f18faf06f6930593
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/ershad-preview-upload"
          archive="$work_dir/site.zip"
          site_dir="$work_dir/site"
          mkdir -p "$site_dir"
          : > "$archive"

          mapfile -t parts < <(find deploy-bundle -maxdepth 1 -type f -name 'part-*.b64' -print | sort)
          test "${#parts[@]}" -eq "$EXPECTED_PARTS"

          for part in "${parts[@]}"; do
            base64 --decode "$part" >> "$archive"
          done

          echo "$EXPECTED_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$site_dir"

          test -f "$site_dir/index.html"
          test -f "$site_dir/404.html"
          test -f "$site_dir/.nojekyll"
          test -f "$site_dir/js/book-preview.js"
          grep -Fq '<base href="/ershad-preview/" />' "$site_dir/index.html"
          cmp "$site_dir/index.html" "$site_dir/404.html"

          if find "$site_dir" -type l -print -quit | grep -q .; then
            echo "Refusing to publish symbolic links."
            exit 1
          fi

      - name: Replace the public preview atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          site_dir="$RUNNER_TEMP/ershad-preview-upload/site"
          git rm -r --ignore-unmatch .
          cp -a "$site_dir/." .
          git add --all

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish latest Ershad frontend preview"
          git push origin HEAD:main

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

